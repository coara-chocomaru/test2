name: Build ARM64 Binary for Android 5.1+ (NDK r10e / Ubuntu 20.04)

on:
  push:
    branches: check4
  pull_request:
    branches: check4
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      NDK_VERSION: r10e
      NDK_HOME: /opt/android-ndk-r10e
      TARGET_ABI: arm64-v8a
      API_LEVEL: android-22
      MODULE_NAME: check_poc
      SOURCE_FILE: check_poc.c

    steps:
      - name: Install base dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget unzip make file git bash coreutils \
            python2 python-is-python2 zstd

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 7 (Zulu)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '7'

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_HOME }}
          key: ndk-${{ env.NDK_VERSION }}-linux-x86_64-v3

      - name: Download and setup Android NDK r10e
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          URLS=(
            "https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip"
            "https://android.googlesource.com/platform/prebuilts/ndk/+/refs/heads/master/android-ndk-r10e-linux-x86_64.bin?format=TEXT"
          )

          cd /opt
          DOWNLOADED=0
          for URL in "${URLS[@]}"; do
            echo "== Trying: $URL =="
            rm -f dl_file

            if ! wget -q --tries=2 --timeout=300 "$URL" -O dl_file; then
              echo "Download failed from: $URL"
              rm -f dl_file
              continue
            fi

            FTYPE=$(file -b dl_file)
            echo "Downloaded file type: $FTYPE"

            case "$FTYPE" in
              *Zip*)
                echo "== Extracting zip =="
                mv dl_file ndk.zip
                unzip -q ndk.zip -d /opt
                rm -f ndk.zip
                DOWNLOADED=1
                ;;
              *executable*|*shell*script*)
                mv dl_file ndk.bin
                chmod +x ndk.bin
                echo "== Running self-extractor =="
                ./ndk.bin > /dev/null
                rm -f ndk.bin
                DOWNLOADED=1
                ;;
              *ASCII*text*)
                echo "== Base64 decoding =="
                base64 -d dl_file > ndk.bin
                rm -f dl_file
                chmod +x ndk.bin
                ./ndk.bin > /dev/null
                rm -f ndk.bin
                DOWNLOADED=1
                ;;
              *)
                echo "Unknown file type, trying next mirror"
                rm -f dl_file
                ;;
            esac

            if [ "$DOWNLOADED" = "1" ]; then
              break
            fi
          done

          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "Error: Failed to download NDK r10e from all mirrors."
            exit 1
          fi

          echo "== NDK layout =="
          ls -d "$NDK_HOME"
          "$NDK_HOME/ndk-build" --version || true

      - name: Ensure source file exists
        run: |
          set -euxo pipefail
          if [ ! -f "${{ env.SOURCE_FILE }}" ]; then
            C_FILE=$(ls *.c 2>/dev/null | head -n1)
            if [ -n "$C_FILE" ]; then
              mv "$C_FILE" "${{ env.SOURCE_FILE }}"
            else
              echo "Error: No .c file found!"
              exit 1
            fi
          fi
          ls -la *.c *.h 2>/dev/null || true

      - name: Generate Android.mk
        run: |
          set -euxo pipefail
          cat > Android.mk << 'EOF'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)

          LOCAL_MODULE := ${{ env.MODULE_NAME }}
          LOCAL_SRC_FILES := ${{ env.SOURCE_FILE }}

          LOCAL_CFLAGS := -fPIE -Wall -Wextra -O2 -pthread
          LOCAL_LDFLAGS := -fPIE -pie

          include $(BUILD_EXECUTABLE)
          EOF
          cat Android.mk

      - name: Build with ndk-build (r10e / GCC 4.9)
        run: |
          set -euxo pipefail
          export PATH="${{ env.NDK_HOME }}:${{ env.NDK_HOME }}/bin:$PATH"
          ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            APP_ABI=${{ env.TARGET_ABI }} \
            APP_PLATFORM=${{ env.API_LEVEL }} \
            -j$(nproc) V=1

      - name: Verify and prepare binary
        run: |
          set -euxo pipefail
          EXPECTED_DIR="libs/${{ env.TARGET_ABI }}"
          EXPECTED_BIN="$EXPECTED_DIR/${{ env.MODULE_NAME }}"

          if [ -f "$EXPECTED_BIN" ]; then
            echo "Binary found."
          else
            ALT_BIN=$(find libs -type f -executable 2>/dev/null | head -n1)
            [ -n "$ALT_BIN" ] || { echo "No binary found in libs/"; exit 1; }
            mkdir -p "$EXPECTED_DIR"
            mv "$ALT_BIN" "$EXPECTED_BIN"
          fi

          file "$EXPECTED_BIN"
          ls -la "$EXPECTED_BIN"

          echo "== Dynamic section =="
          readelf -d "$EXPECTED_BIN" | head -n 40 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE_NAME }}_arm64_android5.1
          path: libs/${{ env.TARGET_ABI }}/${{ env.MODULE_NAME }}
          if-no-files-found: error
